<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>세계관 아카이브</title><style>
    #wa-proto{font-family:Arial,"Noto Sans KR",sans-serif;color:#373832;background:#fbfaf7;border:1px solid #e8e5de;border-radius:14px;overflow:hidden;min-height:720px}
    #wa-proto *{box-sizing:border-box}
    #wa-proto .serif{font-family:Georgia,"Noto Serif KR","Batang","AppleMyungjo",serif}
    #wa-proto .top{height:58px;border-bottom:1px solid #e9e6df;display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:#fff}
    #wa-proto .brand{font-family:Georgia,serif;font-size:17px;letter-spacing:2px}
    #wa-proto .nav{display:flex;gap:22px;align-items:center}
    #wa-proto button{cursor:pointer}
    #wa-proto .nav button{border:0;background:none;color:#77766f;font-size:12px;padding:20px 0;border-bottom:2px solid transparent}
    #wa-proto .nav button.active{color:#34352f;border-color:#85816e}
    #wa-proto .content{max-width:1000px;margin:auto;padding:48px 6% 70px;min-height:590px}
    #wa-proto .eyebrow{font-size:10px;letter-spacing:2px;color:#999486;text-transform:uppercase}
    #wa-proto h1{font-family:Georgia,"Noto Serif KR","Batang","AppleMyungjo",serif;font-weight:400;font-size:clamp(32px,5vw,48px);line-height:1.25;margin:13px 0}
    #wa-proto h2{font-family:Georgia,"Noto Serif KR","Batang","AppleMyungjo",serif;font-size:25px;font-weight:400;margin:0 0 12px}
    #wa-proto h3{font-family:Georgia,"Noto Serif KR","Batang","AppleMyungjo",serif;font-size:18px;font-weight:400;margin:0 0 8px}
    #wa-proto p{line-height:1.85;color:#77766f;font-size:13px}
    #wa-proto .muted{color:#99968d}
    #wa-proto .line{border-top:1px solid #e8e5de;margin:26px 0}
    #wa-proto .btn{border:1px solid #d9d5ca;background:#fff;padding:10px 16px;font-size:12px;color:#555449}
    #wa-proto .btn.dark{background:#45463e;color:white;border-color:#45463e}
    #wa-proto .hero{padding:62px 0 48px;border-bottom:1px solid #e8e5de}
    #wa-proto .hero .intro{max-width:540px;font-family:Georgia,"Noto Serif KR","Batang","AppleMyungjo",serif;font-size:17px;line-height:1.9;color:#77766f;margin:20px 0 26px}
    #wa-proto .homegrid{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;margin-top:42px}
    #wa-proto .notice-row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #eeece7;font-size:12px}
    #wa-proto .notice-row button{border:0;background:none;text-align:left;color:#555;font-size:12px}
    #wa-proto .notice-row time{color:#aaa;font-size:11px;white-space:nowrap}
    #wa-proto .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px}
    #wa-proto .quick button{background:#fff;border:1px solid #e9e6df;padding:20px;text-align:left;min-height:112px}
    #wa-proto .quick strong{display:block;font-family:Georgia,serif;font-size:17px;font-weight:400;margin-bottom:12px}
    #wa-proto .quick span{font-size:11px;color:#999}
    #wa-proto .sectionhead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px}
    #wa-proto .filters{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0}
    #wa-proto .filters button{border:1px solid #e5e2da;background:transparent;padding:7px 13px;font-size:11px;color:#777}
    #wa-proto .filters button.selected{background:#55564d;color:#fff;border-color:#55564d}
    #wa-proto .doclist{border-top:1px solid #dedbd3}
    #wa-proto .doc{display:flex;justify-content:space-between;align-items:center;padding:18px 8px;border-bottom:1px solid #e9e6df;gap:20px}
    #wa-proto .doc button{border:0;background:none;text-align:left;flex:1}
    #wa-proto .doc small{display:block;color:#a19d91;font-size:10px;margin-bottom:6px}
    #wa-proto .doc strong{font-weight:400;font-family:Georgia,"Noto Serif KR","Batang","AppleMyungjo",serif;font-size:17px}
    #wa-proto .doc time{font-size:11px;color:#aaa}
    #wa-proto .chars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    #wa-proto .char{background:#fff;border:1px solid #e8e5de;padding:19px;text-align:left;min-height:160px}
    #wa-proto .initial{width:38px;height:38px;border:1px solid #ddd9cf;border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;color:#8b8779;margin-bottom:17px}
    #wa-proto .char strong{display:block;font-family:Georgia,"Noto Serif KR","Batang","AppleMyungjo",serif;font-size:17px;font-weight:400}
    #wa-proto .char small{display:block;color:#999;font-size:10px;margin-top:7px}
    #wa-proto .profilegrid{display:grid;grid-template-columns:220px 1fr;gap:34px}
    #wa-proto .profilebox{background:#f1efe9;border:1px solid #e5e1d8;padding:22px;height:max-content}
    #wa-proto .profilebox dl{font-size:12px;margin:20px 0 0}
    #wa-proto .profilebox dt{color:#999;font-size:10px;margin-top:14px}
    #wa-proto .profilebox dd{margin:4px 0;color:#555}
    #wa-proto .profiletext{padding:5px 0 22px;border-bottom:1px solid #e8e5de;margin-bottom:22px}
    #wa-proto .profiletext p{white-space:pre-line}
    #wa-proto .editor{border:1px solid #e5e2da;background:white}
    #wa-proto .editbar{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #e8e5de}
    #wa-proto .editbar button{border:1px solid #e4e1d9;background:#fff;padding:7px 10px;font-size:11px}
    #wa-proto textarea{width:100%;min-height:190px;border:0;padding:16px;resize:vertical;font:13px/1.8 monospace;outline:none;color:#555}
    #wa-proto .preview{padding:18px;min-height:190px;font-size:13px;line-height:1.8}
    #wa-proto .adminstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
    #wa-proto .stat{background:#fff;border:1px solid #e8e5de;padding:18px}
    #wa-proto .stat strong{font-family:Georgia,serif;font-size:25px;font-weight:400;display:block;margin-top:8px}
    #wa-proto .footer{border-top:1px solid #e8e5de;padding:22px 6%;font-size:10px;color:#aaa;display:flex;justify-content:space-between}
    #wa-proto .back{border:0;background:none;color:#898579;font-size:12px;padding:0;margin-bottom:25px}
    @media(max-width:600px){#wa-proto .top{height:auto;display:block;padding:15px 18px}#wa-proto .brand{margin-bottom:10px}#wa-proto .nav{gap:16px;overflow:auto}#wa-proto .nav button{padding:8px 0;white-space:nowrap}#wa-proto .content{padding:32px 20px 50px}#wa-proto .homegrid{grid-template-columns:1fr;gap:30px}#wa-proto .quick{grid-template-columns:1fr}#wa-proto .chars{grid-template-columns:repeat(2,1fr)}#wa-proto .profilegrid{grid-template-columns:1fr}#wa-proto .sectionhead{display:block}#wa-proto .footer{display:block;line-height:2}}
  body{margin:0;background:#fbfaf7}#wa-proto{border:0;border-radius:0;min-height:100vh}#wa-proto .content{box-sizing:content-box;max-width:900px;outline:none}#wa-proto .reading{max-width:42rem}#wa-proto .reading p:last-child{font-size:16px}#wa-proto button:hover{background:#f2f0e9}#wa-proto .btn.dark:hover{background:#373832}button:focus-visible{outline:2px solid #766b48;outline-offset:2px}@media(max-width:760px){#wa-proto .nav{max-width:100%;flex-wrap:wrap;gap:4px 14px}#wa-proto .footer span{display:block}#wa-proto .hero{padding:28px 0 32px}}dialog{color:#373832;background:#fbfaf7;border:1px solid #d9d5ca;width:min(32rem,90vw);max-height:85vh;box-sizing:border-box;padding:24px}dialog::backdrop{background:#29291f55}dialog label{display:block;font-size:14px;margin:12px 0}dialog input,dialog textarea{width:100%;padding:8px;border:1px solid #c8c4b8;box-sizing:border-box;font:inherit}dialog textarea{min-height:5rem}dialog button,#staff{padding:7px 12px;cursor:pointer}dialog a{color:#474f3d}dialog p{font-size:14px;line-height:1.6}.reading p{white-space:pre-line}</style></head><body><div id="wa-proto" class="w-full">
  
  <header class="top">
    <div class="brand">THE ARCHIVE <span style="color:#aaa;font-size:10px"> / WORLD</span></div>
    <nav class="nav" aria-label="주요 메뉴">
      <button data-page="home" class="active">홈</button>
      <button data-page="notice">공지</button>
      <button data-page="world">세계관</button>
      <button data-page="characters">인물</button>
      <button data-page="archive">사건 연표</button>
    </nav>
  </header>
  <main class="content" id="wa-content" tabindex="-1"></main>
  <footer class="footer"><span>THE ARCHIVE — A WORLD TO EXPLORE</span><a class="btn" id="staff" href="https://script.google.com/macros/s/AKfycbyFUe8njkZTEV_1U4JGQV5FyBPL_aqi5WdUeuoCdDvlxr_aiRYKEyMHbwpfKLzxhoFfVg/exec" target="_blank" rel="noopener noreferrer" title="Google 계정으로 운영진 편집 화면 열기">운영진 로그인 ↗</a><span>© 2026 · PROTOTYPE V1.0</span></footer>
</div>

<script>
(()=>{
 const root=document.getElementById('wa-proto');if(root.dataset.ready)return;root.dataset.ready='1';
 const content=root.querySelector('#wa-content');
 let page='home',filter='전체',char=0;
 const notices=[], worlds=[], chars=[], archives=[], biographies=[];
 function button(label,action,cls='btn'){return `<button class="${cls}" data-action="${action}">${label}</button>`}
 function render(){
  if(page==='home')content.innerHTML=`
   <div class="hero"><div class="eyebrow">An encyclopedia of our world</div><h1>기록은 세계를<br>이해하는 또 하나의 방법.</h1><div class="intro">이곳은 하나의 세계와 그 안에 살아가는 사람들에 관한 기록을 모아둔 공간입니다. 천천히 둘러보며 이곳의 이야기를 발견해 보세요.</div>${button('세계관 둘러보기','world','btn dark')}　${button('캐릭터 도감','characters')}</div>
   <div class="homegrid"><section><div class="eyebrow">Latest notices</div><h2 style="margin-top:9px">새로운 소식</h2>${notices.map((n,i)=>`<div class="notice-row"><button data-action="notice-${i}">${n[1]}</button><time>${n[2]}</time></div>`).join('')}</section><section><div class="eyebrow">Introduction</div><h2 style="margin-top:9px">아카이브 안내</h2><p>세계관의 기초부터 인물들의 기록까지, 다양한 문서를 한곳에서 열람할 수 있습니다.</p><div class="line"></div><div class="eyebrow">Recently added</div><p style="color:#555">새로운 세계관 문서 3건<br>캐릭터 프로필 2건</p></section></div>
   <div class="quick"><button data-action="world"><strong>세계관 ↗</strong><span>세계의 구조와 설정</span></button><button data-action="characters"><strong>인물 ↗</strong><span>이 세계에 살아가는 사람들</span></button><button data-action="archive"><strong>사건 연표 ↗</strong><span>사건과 자료의 기록</span></button></div>`;
  if(page==='notice')content.innerHTML=`<div class="sectionhead"><div><div class="eyebrow">News & Announcements</div><h1>공지사항</h1><p>홈페이지의 소식과 운영 관련 안내를 확인할 수 있습니다.</p></div></div><div class="doclist">${notices.map((n,i)=>`<div class="doc"><button data-action="notice-${i}"><small>${n[0]}</small><strong>${n[1]}</strong></button><time>${n[2]}</time></div>`).join('')}</div>`;
  if(page==='world')content.innerHTML=`<div class="eyebrow">World encyclopedia</div><h1>세계관</h1><p>이 세계를 구성하는 배경과 규칙, 역사에 관한 기록입니다.</p><div class="filters">${['전체',...new Set(worlds.map(w=>w[1]))].map(f=>`<button class="${escapeText(filter)===f?'selected':''}" data-filter="${f}">${f}</button>`).join('')}</div><div class="doclist">${worlds.filter(w=>filter==='전체'||w[1]===escapeText(filter)).map((w,i)=>`<div class="doc"><button data-action="world-${worlds.indexOf(w)}"><small>${w[1]}</small><strong>${w[0]}</strong><p style="margin:6px 0 0;font-size:11px">${w[2]}</p></button><span class="muted">↗</span></div>`).join('')}</div>`;
  if(page==='characters')content.innerHTML=`<div class="eyebrow">Character index</div><h1>인물 도감</h1><p>각자의 이야기를 가진 인물들의 기록을 모았습니다.</p><div class="filters">${['전체',...new Set(chars.map(c=>c[1]))].map(f=>`<button class="${escapeText(filter)===f?'selected':''}" data-filter="${f}">${f}</button>`).join('')}</div><div class="chars">${chars.filter(c=>filter==='전체'||c[1]===escapeText(filter)).map(c=>`<button class="char" data-char="${chars.indexOf(c)}"><span class="initial">${c[3]}</span><strong>${c[0]}</strong><small>${c[1]} · ${c[2]}</small></button>`).join('')}</div>`;
  if(page==='profile'){const c=chars[char];const bio=biographies[chars.indexOf(c)];content.innerHTML=`<button class="back" data-action="characters">← 인물 도감으로</button><div class="profilegrid"><aside class="profilebox"><div class="eyebrow">Character profile</div><div class="initial" style="width:66px;height:66px;font-size:24px;margin:20px 0">${c[3]}</div><h2>${c[0]}</h2><p>${c[2]}</p><dl><dt>소속</dt><dd>${c[1]}</dd><dt>분류</dt><dd>주요 인물</dd><dt>상태</dt><dd>활동 중</dd></dl></aside><section><div class="eyebrow">Profile / ${String(chars.indexOf(c)+1).padStart(3,"0")}</div><h1>${c[0]}</h1><p style="font-family:Georgia,serif;font-size:17px">“${bio[0]}”</p><div class="line"></div><div class="profiletext"><h3>외관</h3><p>${bio[1]}</p></div><div class="profiletext"><h3>성격</h3><p>${bio[2]}</p></div><div class="profiletext"><h3>배경</h3><p>${bio[3]}</p></div><div class="profiletext"><h3>능력 및 기타</h3><p>${bio[4]}</p></div></section></div>`}
  if(page==='archive')content.innerHTML=`<div class="eyebrow">Historical records</div><h1>사건 연표</h1><p>사건과 자료, 시간의 흐름을 따라 정리한 기록입니다.</p><div class="filters">${['전체',...new Set(archives.map(a=>a[1]))].map(f=>`<button class="${escapeText(filter)===f?'selected':''}" data-filter="${f}">${f}</button>`).join('')}</div><div class="doclist">${archives.filter(a=>filter==='전체'||a[1]===escapeText(filter)).map((a,i)=>`<div class="doc"><button data-action="archive-${archives.indexOf(a)}"><small>${a[1]}</small><strong>${a[0]}</strong></button><time>${a[2]}</time></div>`).join('')}</div>`;
 }
 function navigate(section, id) {
  const path = section + (id === undefined ? '' : '/' + id);
  if(location.hash.slice(1) === path) openRoute();
  else location.hash = path;
 }
 const collections = {notice:notices, world:worlds, characters:chars, archive:archives};
 const sectionNames = {notice:'공지사항',world:'세계관',characters:'인물 도감',archive:'사건 연표'};
 const readings={notice:[],world:[],archive:[]};
 function openRoute() {
  const [section,id] = location.hash.slice(1).split('/');
  const list = Object.hasOwn(collections,section) ? collections[section] : null;
  const parent = list ? section : 'home';
  const index = list ? records[parent].findIndex(record=>record.id===id) : -1;
  const item = list && list[index];
  if(parent !== currentSection) filter='전체';
  currentSection=parent;
  page=parent;
  if(item && parent==='characters'){char=index; page='profile';}
  render();
  if(item && parent!=='characters'){
   const title=parent==='notice'?item[1]:item[0];
   const category=parent==='notice'?item[0]:item[1];
   content.innerHTML=button('← '+sectionNames[parent]+' 목록',parent,'back')+
    '<article class="reading"><div class="eyebrow">'+sectionNames[parent]+' / '+category+'</div><h1>'+title+'</h1><p>'+item[2]+'</p><div class="line"></div><p>'+readings[parent][index]+'</p></article>';
  }
  for(const btn of root.querySelectorAll('.nav button')){
   btn.classList.toggle('active',btn.dataset.page===parent);
   if(btn.dataset.page===parent)btn.setAttribute('aria-current','page');else btn.removeAttribute('aria-current');
  }
  document.title=(content.querySelector('h1')?.textContent || '홈')+' · THE ARCHIVE';
  window.scrollTo(0,0);
  content.focus({preventScroll:true});
 }
 let currentSection='';
 root.addEventListener('click',event=>{
  const b=event.target.closest('button');if(!b)return;
  if(b.dataset.page)navigate(b.dataset.page);
  else if(b.dataset.char)navigate('characters',records.characters[Number(b.dataset.char)].id);
  else if(b.dataset.filter){filter=b.textContent;openRoute();Array.from(content.querySelectorAll('[data-filter]')).find(el=>el.textContent===filter)?.focus();}
  else if(b.dataset.action){const [section,id]=b.dataset.action.split('-');navigate(section,id===undefined?undefined:records[section][Number(id)].id);}
 });
 window.addEventListener('hashchange',openRoute);
